<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flow State</title>
<meta name="description" content="Le programme quotidien de Nathan Boyer.">
<meta name="theme-color" content="#D8DBCF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Flow State">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
/* Olive v2, un seul thème clair assumé. Gabarit iPhone 13 (390 × 844 points). */
:root{
  --page:#C9CCBF; --bg:#D8DBCF; --card:#E4E6DC; --field:#EEEFE8;
  --ink:#1C2433; --muted:#4C5446; --line:#BCC0AE;
  --accent:#485829; --accent2:#22355C; --on-accent:#EEF0E7;
  --warn:#8A3B1E;
  --display:'Bricolage Grotesque', system-ui, sans-serif;
  --body:'Instrument Sans', system-ui, -apple-system, sans-serif;
  --r:18px;
  color-scheme: light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;overscroll-behavior:none}
button,input,textarea{font:inherit;color:inherit}
#app{height:100%;display:flex;flex-direction:column}
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;
  padding:calc(env(safe-area-inset-top,0px) + 14px) max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
main::-webkit-scrollbar{display:none}
.screen{display:grid;gap:14px;max-width:430px;margin:0 auto}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.top small{display:block;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.09em;font-weight:600}
h1,h2,h3{margin:0;font-family:var(--display);font-weight:800;letter-spacing:-.01em;text-wrap:balance}
h2{font-size:1.75rem;line-height:1.05;margin-top:4px}
h3{font-size:1.15rem}
.nav-date{display:flex;gap:6px;flex:none}
.nav-date button{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:18px;line-height:1;display:grid;place-items:center}
.nav-date button.today{width:auto;padding:0 12px;border-radius:999px;font-size:13px;font-weight:600}
.motto{background:var(--accent);color:var(--on-accent);border-radius:var(--r);padding:14px 16px;font-family:var(--display);font-weight:800;font-size:1.05rem;line-height:1.3}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:10px}
.tag{font-size:11px;text-transform:uppercase;letter-spacing:.11em;color:var(--accent2);font-weight:700}
.card p{margin:0}
.defi{border-top:1px dashed var(--line);padding-top:9px;font-size:.95rem}
.defi b{color:var(--accent)}
.but{font-size:.84rem;color:var(--muted)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mini{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-width:0}
.mini small{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.09em;font-weight:600}
.mini strong{display:block;font-family:var(--display);font-weight:800;font-size:1.4rem;margin-top:2px;font-variant-numeric:tabular-nums}
.mini span{display:block;font-size:.84rem;color:var(--muted);line-height:1.3}
.mini.alert strong{color:var(--warn)}
.laws{display:grid;gap:7px;margin:0;padding:0;list-style:none}
.laws li{display:flex;gap:10px;font-size:.95rem;line-height:1.35}
.laws li b{color:var(--accent2);min-width:30px;font-variant-numeric:tabular-nums}
.linkbtn{background:none;border:0;padding:4px 0;color:var(--accent);font-weight:700;font-size:.9rem;text-align:left}
.check{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left;font-size:.96rem}
.check:last-child{border-bottom:0}
.dot{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;background:var(--field)}
.dot.on{background:var(--accent);border-color:var(--accent)}
.dot.on::after{content:"";width:10px;height:6px;border-left:2.5px solid var(--on-accent);border-bottom:2.5px solid var(--on-accent);transform:rotate(-45deg) translate(1px,-1px)}
.yn-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:.96rem}
.yn-row:last-child{border-bottom:0}
.yn{display:flex;gap:6px;flex:none}
.yn button{font-size:13px;font-weight:600;padding:7px 13px;border-radius:999px;border:1px solid var(--line);background:var(--field);color:var(--muted)}
.yn button.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.yn button.on.no{background:var(--accent2);border-color:var(--accent2)}
label.f{display:grid;gap:5px;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
input[type=text],input[type=number],input[type=search],textarea{width:100%;background:var(--field);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:16px;text-transform:none;letter-spacing:normal;font-weight:400;color:var(--ink)}
textarea{min-height:74px;resize:vertical}
input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent2);outline-offset:1px}
.hint{font-size:.84rem;color:var(--muted)}
.bar{height:9px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.score{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.score strong{font-family:var(--display);font-size:1.6rem;font-variant-numeric:tabular-nums}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--accent);color:var(--on-accent)}
.pill.off{background:var(--line);color:var(--muted)}
.btn{border:0;border-radius:14px;padding:13px 16px;font-weight:700;background:var(--accent2);color:var(--on-accent);font-size:.98rem;width:100%}
.btn.ghost{background:var(--field);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--warn)}
.btns{display:grid;gap:8px}
.list{display:grid;gap:10px}
.entry{border-top:1px solid var(--line);padding-top:10px;display:grid;gap:3px;font-size:.93rem}
.entry:first-child{border-top:0;padding-top:0}
.entry small{color:var(--muted);font-size:12px}
.entry b{font-weight:700}
.grid28{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.grid28 span{aspect-ratio:1;border-radius:7px;background:var(--field);border:1px solid var(--line)}
.grid28 span.l1{background:#C3CAA7;border-color:#C3CAA7}
.grid28 span.l2{background:#8E9C64;border-color:#8E9C64}
.grid28 span.l3{background:var(--accent);border-color:var(--accent)}
.grid28 span.today{outline:2px solid var(--accent2);outline-offset:1px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);align-items:center}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;font-size:11px;color:var(--muted);text-align:center;font-weight:600}
svg text{fill:var(--muted);font-family:var(--body);font-size:11px}
.tbl{overflow-x:auto;scrollbar-width:none}
.tbl::-webkit-scrollbar{display:none}
table{border-collapse:collapse;font-size:.86rem;width:100%;min-width:520px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.wk-table td:nth-child(2){white-space:nowrap}
tr.cur td{background:var(--field);font-weight:600}
details{border-top:1px solid var(--line);padding-top:8px}
details:first-of-type{border-top:0;padding-top:0}
summary{font-weight:700;cursor:pointer;padding:4px 0}
details p{margin:6px 0 4px;font-size:.95rem}
.note{font-size:12px;color:var(--muted);text-align:center}
nav.tabs{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);background:var(--card);
  padding:6px max(4px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 6px) max(4px,env(safe-area-inset-left,0px))}
nav.tabs button{background:none;border:0;font-size:11px;color:var(--muted);display:grid;gap:4px;justify-items:center;padding:6px 0;font-weight:600}
nav.tabs button::before{content:"";width:22px;height:3px;border-radius:2px;background:transparent}
nav.tabs button.on{color:var(--accent);font-weight:700}
nav.tabs button.on::before{background:var(--accent)}
.lock{min-height:100%;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-left,0px))}
.lock .box{display:grid;gap:14px;max-width:320px;width:100%;text-align:center;justify-items:center}
.lock img{width:96px;height:96px;border-radius:22px}
.lock input{text-align:center;font-size:24px;letter-spacing:.3em}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 84px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:.9rem;font-weight:600;z-index:9}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<script type="module" src="app.js"></script>
</body>
</html>
